# Base configuration shared by every profile.
#
# Profiles:
#   local - developer machine; also reads backend/.env (application-local.yml)
#   test  - automated tests; fixed fake values (application-test.yml)
#   prod  - deployed; values come ONLY from real environment variables
#
# Every app setting below maps an environment variable onto a validated
# @ConfigurationProperties record in app.nichez.config. A blank value means
# "not set": required ones fail startup with a message naming the property.
# This file must never import .env; only application-local.yml does.

spring:
  application:
    name: api

  jpa:
    open-in-view: false
    hibernate:
      # Schema is owned by supabase/migrations; JPA only validates it.
      ddl-auto: validate

db:
  url: ${DB_URL:}
  username: ${DB_USERNAME:}
  password: ${DB_PASSWORD:}

auth:
  mode: ${AUTH_MODE:}                  # HS256 or JWKS
  jwt-secret: ${SUPABASE_JWT_SECRET:}  # required when mode = HS256
  jwks-uri: ${SUPABASE_JWKS_URI:}      # required when mode = JWKS
  issuer: ${SUPABASE_JWT_ISSUER:}

  sms:
    # ISO region codes. Placeholder default: confirm the launch countries.
    allowed-countries: ${AUTH_SMS_ALLOWED_COUNTRIES:NG,GH,KE,ZA,GB,US}
    max-sends-per-phone-per-hour: ${AUTH_SMS_MAX_SENDS_PER_PHONE_PER_HOUR:5}
    max-sends-per-ip-per-hour: ${AUTH_SMS_MAX_SENDS_PER_IP_PER_HOUR:20}
    resend-cooldown: ${AUTH_SMS_RESEND_COOLDOWN:60s}
    code-ttl: ${AUTH_SMS_CODE_TTL:5m}
    max-attempts: ${AUTH_SMS_MAX_ATTEMPTS:3}
    lockout: ${AUTH_SMS_LOCKOUT:30m}

profile:
  handle-check-per-minute: ${PROFILE_HANDLE_CHECK_PER_MINUTE:60}   # per signed-in user

posts:
  media-retention: ${POSTS_MEDIA_RETENTION:30d}      # deleted/removed posts' files are kept this long
  purge-cron: ${POSTS_PURGE_CRON:0 30 3 * * *}       # daily purge, UTC
  purge-batch-size: ${POSTS_PURGE_BATCH_SIZE:100}
  create-per-hour: ${POSTS_CREATE_PER_HOUR:20}       # per signed-in user

uploads:
  allowed-types: ${UPLOADS_ALLOWED_TYPES:image/jpeg,image/png,image/gif,image/webp,video/mp4,video/quicktime}
  max-image-size: ${UPLOADS_MAX_IMAGE_SIZE:20MB}
  max-video-size: ${UPLOADS_MAX_VIDEO_SIZE:200MB}
  url-ttl: ${UPLOADS_URL_TTL:15m}                    # how long a presigned upload URL works
  sign-per-hour: ${UPLOADS_SIGN_PER_HOUR:30}         # per signed-in user

supabase:
  url: ${SUPABASE_URL:}                # server-to-server calls to Supabase Auth
  anon-key: ${SUPABASE_ANON_KEY:}      # public API key, sent as the apikey header

storage:
  endpoint: ${STORAGE_ENDPOINT:}               # server-side calls (HEAD, DELETE)
  public-endpoint: ${STORAGE_PUBLIC_ENDPOINT:} # host baked into presigned URLs
  region: ${STORAGE_REGION:}
  access-key: ${STORAGE_ACCESS_KEY:}
  secret-key: ${STORAGE_SECRET_KEY:}
  bucket: ${STORAGE_BUCKET:}

media:
  url-provider: ${MEDIA_URL_PROVIDER:}         # presigned or worker
  ttl: ${MEDIA_URL_TTL:15m}
  worker-base-url: ${WORKER_BASE_URL:}         # required when url-provider = worker
  token-secret: ${PLAYBACK_TOKEN_SECRET:}      # required when url-provider = worker

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:}

rate-limit:
  enabled: ${RATE_LIMIT_ENABLED:true}
  requests-per-minute: ${RATE_LIMIT_REQUESTS_PER_MINUTE:120}
  burst: ${RATE_LIMIT_BURST:30}

management:
  endpoints:
    web:
      exposure:
        include: health
