# Base configuration shared by every profile.
#
# Profiles:
#   local - developer machine; also reads backend/.env (application-local.yml)
#   test  - automated tests; fixed fake values (application-test.yml)
#   prod  - deployed; values come ONLY from real environment variables
#
# Every app setting below maps an environment variable onto a validated
# @ConfigurationProperties record in app.nichez.config. A blank value means
# "not set": required ones fail startup with a message naming the property.
# This file must never import .env; only application-local.yml does.

spring:
  application:
    name: api

  jpa:
    open-in-view: false
    hibernate:
      # Schema is owned by supabase/migrations; JPA only validates it.
      ddl-auto: validate

db:
  url: ${DB_URL:}
  username: ${DB_USERNAME:}
  password: ${DB_PASSWORD:}

auth:
  mode: ${AUTH_MODE:}                  # HS256 or JWKS
  jwt-secret: ${SUPABASE_JWT_SECRET:}  # required when mode = HS256
  jwks-uri: ${SUPABASE_JWKS_URI:}      # required when mode = JWKS
  issuer: ${SUPABASE_JWT_ISSUER:}

  sms:
    # ISO region codes. Placeholder default: confirm the launch countries.
    allowed-countries: ${AUTH_SMS_ALLOWED_COUNTRIES:NG,GH,KE,ZA,GB,US}
    max-sends-per-phone-per-hour: ${AUTH_SMS_MAX_SENDS_PER_PHONE_PER_HOUR:5}
    max-sends-per-ip-per-hour: ${AUTH_SMS_MAX_SENDS_PER_IP_PER_HOUR:20}
    resend-cooldown: ${AUTH_SMS_RESEND_COOLDOWN:60s}
    code-ttl: ${AUTH_SMS_CODE_TTL:5m}
    max-attempts: ${AUTH_SMS_MAX_ATTEMPTS:3}
    lockout: ${AUTH_SMS_LOCKOUT:30m}

profile:
  handle-check-per-minute: ${PROFILE_HANDLE_CHECK_PER_MINUTE:60}   # per signed-in user

posts:
  media-retention: ${POSTS_MEDIA_RETENTION:30d}      # deleted/removed posts' files are kept this long
  purge-cron: ${POSTS_PURGE_CRON:0 30 3 * * *}       # daily purge, UTC
  purge-batch-size: ${POSTS_PURGE_BATCH_SIZE:100}
  create-per-hour: ${POSTS_CREATE_PER_HOUR:20}       # per signed-in user
  publish-enabled: ${POSTS_PUBLISH_ENABLED:true}     # in-process publisher; off once a real media pipeline takes the queue
  publish-interval: ${POSTS_PUBLISH_INTERVAL:5s}     # pause between publisher passes
  publish-batch-size: ${POSTS_PUBLISH_BATCH_SIZE:50}

uploads:
  allowed-types: ${UPLOADS_ALLOWED_TYPES:image/jpeg,image/png,image/gif,image/webp,video/mp4,video/quicktime}
  max-image-size: ${UPLOADS_MAX_IMAGE_SIZE:20MB}
  max-video-size: ${UPLOADS_MAX_VIDEO_SIZE:200MB}
  url-ttl: ${UPLOADS_URL_TTL:15m}                    # how long a presigned upload URL works
  sign-per-hour: ${UPLOADS_SIGN_PER_HOUR:30}         # per signed-in user

app:
  public-base-url: ${APP_PUBLIC_BASE_URL:https://nichez.app}   # share links point here
  min-app-version: ${APP_MIN_VERSION:1.0.0}                    # older apps are told to update
  terms-url: ${APP_TERMS_URL:https://nichez.app/terms}
  privacy-url: ${APP_PRIVACY_URL:https://nichez.app/privacy}
  feature-live: ${APP_FEATURE_LIVE:false}                      # which parts of the plan the server serves
  feature-reels: ${APP_FEATURE_REELS:false}
  feature-direct-messages: ${APP_FEATURE_DIRECT_MESSAGES:false}

social:
  view-min-watched-ms: ${SOCIAL_VIEW_MIN_WATCHED_MS:3000}      # placeholder until the earnings rules are agreed
  view-batch-max: ${SOCIAL_VIEW_BATCH_MAX:50}                  # playback reports per POST /views
  view-batches-per-minute: ${SOCIAL_VIEW_BATCHES_PER_MINUTE:30} # POST /views calls per signed-in user
  story-ttl: ${SOCIAL_STORY_TTL:24h}
  reactions-per-minute: ${SOCIAL_REACTIONS_PER_MINUTE:120}     # per signed-in user
  comments-per-hour: ${SOCIAL_COMMENTS_PER_HOUR:60}
  follows-per-hour: ${SOCIAL_FOLLOWS_PER_HOUR:200}
  reports-per-hour: ${SOCIAL_REPORTS_PER_HOUR:20}
  searches-per-minute: ${SOCIAL_SEARCHES_PER_MINUTE:60}
  public-lookups-per-minute: ${SOCIAL_PUBLIC_LOOKUPS_PER_MINUTE:60}  # share-link lookups per IP address
  stories-per-day: ${SOCIAL_STORIES_PER_DAY:30}
  communities-per-day: ${SOCIAL_COMMUNITIES_PER_DAY:5}
  niches-per-day: ${SOCIAL_NICHES_PER_DAY:5}

account:
  deletion-grace: ${ACCOUNT_DELETION_GRACE:14d}                # hidden at once, erased after this
  deletion-cron: ${ACCOUNT_DELETION_CRON:0 0 4 * * *}          # daily erase, UTC
  deletion-batch-size: ${ACCOUNT_DELETION_BATCH_SIZE:50}

request-log:
  # Every call under /api is recorded in the request_logs table: route, status, milliseconds, caller.
  # Never the query string, body or headers. Written in batches, so it cannot slow a request.
  enabled: ${REQUEST_LOG_ENABLED:true}
  flush-interval: ${REQUEST_LOG_FLUSH_INTERVAL:5s}      # how soon a request shows up in the table
  batch-size: ${REQUEST_LOG_BATCH_SIZE:500}
  queue-capacity: ${REQUEST_LOG_QUEUE_CAPACITY:10000}   # waiting entries kept in memory; more are dropped, not waited for
  retention: ${REQUEST_LOG_RETENTION:30d}               # older rows are deleted by a daily job
  purge-cron: ${REQUEST_LOG_PURGE_CRON:0 15 3 * * *}    # UTC

supabase:
  url: ${SUPABASE_URL:}                # server-to-server calls to Supabase Auth
  anon-key: ${SUPABASE_ANON_KEY:}      # public API key, sent as the apikey header

storage:
  endpoint: ${STORAGE_ENDPOINT:}               # server-side calls (HEAD, DELETE)
  public-endpoint: ${STORAGE_PUBLIC_ENDPOINT:} # host baked into presigned URLs
  region: ${STORAGE_REGION:}
  access-key: ${STORAGE_ACCESS_KEY:}
  secret-key: ${STORAGE_SECRET_KEY:}
  bucket: ${STORAGE_BUCKET:}

media:
  url-provider: ${MEDIA_URL_PROVIDER:}         # presigned or worker
  ttl: ${MEDIA_URL_TTL:15m}
  worker-base-url: ${WORKER_BASE_URL:}         # required when url-provider = worker
  token-secret: ${PLAYBACK_TOKEN_SECRET:}      # required when url-provider = worker

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:}

rate-limit:
  enabled: ${RATE_LIMIT_ENABLED:true}
  requests-per-minute: ${RATE_LIMIT_REQUESTS_PER_MINUTE:120}
  burst: ${RATE_LIMIT_BURST:30}

# Swagger UI and the OpenAPI document. Off everywhere; only application-local.yml turns them on.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health
