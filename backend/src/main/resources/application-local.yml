# Developer machine. Values come from backend/.env (copy backend/.env.example).
# Real environment variables still win over the file.
# Working directory must be backend/: the VS Code launch config and
# ./mvnw spring-boot:run both use it.
spring:
  config:
    import: optional:file:.env[.properties]

# Swagger UI at http://localhost:8080/swagger-ui.html. Local only: it is open without a token.
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    persist-authorization: true   # keeps the pasted token across page reloads
    tags-sorter: alpha
    operations-sorter: method
