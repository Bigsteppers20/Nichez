# Render Blueprint for the API. Secrets are never stored here: every `sync: false`
# variable is asked for in the Render dashboard when the Blueprint is created.
# Pick the Render region closest to the Supabase project (set it on the service).
services:
  - type: web
    name: nichez-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    branch: Backend
    # `free` sleeps after 15 minutes without traffic, which pauses the scheduled
    # jobs (request-log flush and purge, post purge, account deletion). Use a paid
    # plan, e.g. `starter`, for anything beyond testing.
    plan: free
    healthCheckPath: /api/v1/ping
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      # Database: the Supabase session-mode pooler URL (Render cannot reach the
      # IPv6-only direct host), as jdbc:postgresql://...
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      # Auth: verify Supabase tokens against the project's published signing keys.
      - key: AUTH_MODE
        value: JWKS
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_JWKS_URI
        sync: false
      - key: SUPABASE_JWT_ISSUER
        sync: false
      # Media storage (Cloudflare R2, S3 API).
      - key: STORAGE_ENDPOINT
        sync: false
      - key: STORAGE_PUBLIC_ENDPOINT
        sync: false
      - key: STORAGE_REGION
        sync: false
      - key: STORAGE_ACCESS_KEY
        sync: false
      - key: STORAGE_SECRET_KEY
        sync: false
      - key: STORAGE_BUCKET
        sync: false
      # Playback: PRESIGNED or WORKER. WORKER also needs the two values below.
      - key: MEDIA_URL_PROVIDER
        sync: false
      - key: WORKER_BASE_URL
        sync: false
      - key: PLAYBACK_TOKEN_SECRET
        sync: false
      # Browser origins allowed by CORS. Leave empty: the Flutter app sends none.
      - key: CORS_ALLOWED_ORIGINS
        value: ""
